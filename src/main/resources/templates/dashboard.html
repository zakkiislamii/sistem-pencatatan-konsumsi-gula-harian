<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Sistem Pencatatan Gula Harian</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 min-h-screen p-4 md:p-8 relative font-sans text-slate-800 overflow-x-hidden">

    <div class="absolute top-0 left-0 w-[40rem] h-[40rem] bg-green-700/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none z-0"></div>
    <div class="absolute bottom-0 right-0 w-[40rem] h-[40rem] bg-amber-600/10 rounded-full blur-3xl translate-x-1/3 translate-y-1/3 pointer-events-none z-0"></div>

    <div class="max-w-6xl mx-auto relative z-10">
        
        <!-- Header -->
        <header class="bg-white/70 backdrop-blur-xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2rem] p-6 md:px-10 md:py-8 mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
            <div>
                <p class="uppercase tracking-widest text-xs font-extrabold text-slate-500 mb-2">Dashboard</p>
                <h1 class="font-serif text-3xl md:text-4xl text-slate-900 m-0">
                    Halo, <span th:text="${name}" class="text-green-700">User</span>
                </h1>
            </div>
            
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="bg-slate-900 text-white font-bold rounded-xl px-6 py-3 shadow-lg shadow-slate-900/20 hover:shadow-xl hover:shadow-slate-900/40 hover:-translate-y-0.5 transition-all w-full sm:w-auto">
                    Logout
                </button>
            </form>
        </header>

        <div class="flex justify-end mb-6">
            <a href="#" id="open-consumption-add"
               class="px-6 py-3.5 bg-gradient-to-br from-green-600 to-green-800 text-white text-sm font-bold rounded-2xl shadow-lg shadow-green-900/20 hover:shadow-xl hover:-translate-y-0.5 transition-all flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tambah Data
            </a>
        </div>

        <!-- Consumption Section -->
        <section class="bg-white/60 backdrop-blur-xl border border-white shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-[2.5rem] p-6 md:p-10">

            <!-- Notifikasi -->
            <div th:if="${success != null}" class="mb-6 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm font-bold">
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error != null}" class="mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-bold">
                <span th:text="${error}"></span>
            </div>

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h3 class="font-serif text-2xl font-bold text-slate-900">Catatan Konsumsi Gula</h3>
                    <p class="text-slate-500 text-sm font-medium mt-1">Pantau asupan gula harianmu di sini.</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <form th:action="@{/dashboard}" method="get" class="flex items-center gap-2 bg-white/80 p-1.5 rounded-2xl border border-slate-200 shadow-sm">
                        <input type="date" name="date"
                               class="bg-transparent border-none px-3 py-2 text-sm font-medium text-slate-700 focus:outline-none focus:ring-0"
                               th:value="${selectedDate}" />
                        <button type="submit" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-bold rounded-xl transition-colors">
                            Lihat Tanggal
                        </button>
                    </form>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${consumptions != null and #lists.isEmpty(consumptions)}"
                 class="bg-slate-50/50 border border-dashed border-slate-300 rounded-[2rem] p-12 text-center">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm border border-slate-100">
                    <span class="text-2xl">🍃</span>
                </div>
                <h4 class="font-bold text-slate-800 mb-1">Belum ada catatan</h4>
                <p class="text-slate-500 text-sm">Kamu belum mencatat konsumsi gula untuk tanggal ini.</p>
            </div>

            <!-- List Data -->
            <ul class="grid grid-cols-1 md:grid-cols-2 gap-4"
                th:if="${consumptions != null and !#lists.isEmpty(consumptions)}">
                <li th:each="c : ${consumptions}"
                    class="bg-white/80 border border-slate-100 shadow-sm hover:shadow-md rounded-[1.5rem] p-5 flex justify-between items-center transition-all group">
                    <div class="flex items-start gap-4">
                        <div class="bg-green-50 text-green-700 font-bold px-4 py-3 rounded-xl border border-green-100 text-center min-w-[5rem]">
                            <span class="block text-xl leading-none" th:text="${c.amount}">0</span>
                            <span class="text-[10px] uppercase tracking-wider mt-1 block">gram</span>
                        </div>
                        <div>
                            <div class="font-bold text-slate-800 mb-0.5 text-base" th:text="${c.description}">Deskripsi</div>
                            <div class="text-xs font-medium text-slate-500 flex items-center gap-1.5">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                <span th:text="${#temporals.format(c.consumedAt, 'HH:mm • dd MMM yyyy')}">12:00 • 01 Jan 2026</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <a href="#"
                        th:attr="data-id=${c.consumptionId}"
                        class="consumption-edit px-4 py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 text-sm font-bold rounded-xl border border-slate-200 transition-all">
                        Edit
                        </a>
                    </div>
                </li>
            </ul>

            <!-- Modal -->
            <div id="consumption-modal" class="fixed inset-0 hidden items-center justify-center z-50">
                <div id="consumption-modal-overlay" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity"></div>
                <div class="relative z-10 w-full max-w-lg p-4 transform transition-all scale-95 opacity-0 duration-300"
                     id="consumption-modal-content">
                    <div id="consumption-modal-body">
                        <!-- ✅ th:replace di dalam wrapper agar ID tidak hilang -->
                        <div th:replace="~{fragments/consumption-form-fragment :: consumptionForm}"></div>
                    </div>
                </div>
            </div>

            <script th:src="@{/js/dashboard.js}"></script>
        </section>
    </div>
</body>
</html>
