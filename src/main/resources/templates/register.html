<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Sistem Pencatatan Gula Harian</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['Fraunces', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-stone-50 min-h-screen flex items-center justify-center p-4 md:p-8 relative font-sans text-slate-800 overflow-x-hidden">
    <!-- Background Gradient Ornaments -->
    <div class="absolute top-0 left-0 w-[40rem] h-[40rem] bg-green-700/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[40rem] h-[40rem] bg-amber-600/10 rounded-full blur-3xl translate-x-1/3 translate-y-1/3 pointer-events-none"></div>

    <main class="w-full max-w-5xl bg-white/60 backdrop-blur-xl border border-white shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] rounded-[2.5rem] p-3 md:p-5 grid grid-cols-1 lg:grid-cols-[1.1fr_0.9fr] gap-4 relative z-10">
        
        <!-- Hero Panel -->
        <section class="relative bg-gradient-to-br from-amber-900 to-amber-700 rounded-[2rem] p-8 md:p-12 flex flex-col justify-end text-white overflow-hidden min-h-[300px] lg:min-h-[600px]">
            <!-- Decorative circle -->
            <div class="absolute -bottom-16 -right-16 w-64 h-64 bg-white/10 rounded-full blur-2xl"></div>
            <div class="absolute top-10 left-10 w-32 h-32 bg-white/5 rounded-full blur-xl"></div>
            
            <div class="relative z-10">
                <p class="uppercase tracking-widest text-xs font-extrabold text-amber-200/80 mb-4">Buat Akun Baru</p>
                <h1 class="font-serif text-4xl md:text-5xl leading-tight mb-4">Daftar sekali, lalu masuk ke dashboard yang aman.</h1>
                <p class="text-amber-100/80 font-medium">Password akan disimpan dalam bentuk hash yang aman, bukan teks biasa.</p>
            </div>
        </section>

        <!-- Form Panel -->
        <section class="p-6 md:p-10 flex flex-col justify-center">
            <div class="mb-8">
                <h2 class="font-serif text-3xl font-bold text-slate-900 mb-2">Register</h2>
                <p class="text-slate-500 font-medium">Lengkapi data berikut untuk membuat akun.</p>
            </div>

            <form class="flex flex-col gap-4" th:action="@{/register}" th:object="${registerForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label class="flex flex-col gap-1.5">
                    <span class="text-sm font-bold text-slate-700">Nama Lengkap</span>
                    <input type="text" th:field="*{name}" placeholder="Masukkan nama" 
                           class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-amber-600/15 focus:border-amber-600 transition-all shadow-sm">
                    <small class="text-red-600 font-semibold text-xs mt-1 empty:hidden" th:errors="*{name}"></small>
                </label>

                <label class="flex flex-col gap-1.5">
                    <span class="text-sm font-bold text-slate-700">Username</span>
                    <input type="text" th:field="*{username}" placeholder="Pilih username" 
                           class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-amber-600/15 focus:border-amber-600 transition-all shadow-sm">
                    <small class="text-red-600 font-semibold text-xs mt-1 empty:hidden" th:errors="*{username}"></small>
                </label>

                <label class="flex flex-col gap-1.5">
                    <span class="text-sm font-bold text-slate-700">Password</span>
                    <input type="password" th:field="*{password}" placeholder="Buat password" 
                           class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-amber-600/15 focus:border-amber-600 transition-all shadow-sm">
                    <small class="text-red-600 font-semibold text-xs mt-1 empty:hidden" th:errors="*{password}"></small>
                </label>

                <label class="flex flex-col gap-1.5">
                    <span class="text-sm font-bold text-slate-700">Konfirmasi Password</span>
                    <input type="password" th:field="*{confirmPassword}" placeholder="Ulangi password" 
                           class="w-full bg-white/80 border border-slate-200 rounded-xl px-4 py-3 text-sm font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-amber-600/15 focus:border-amber-600 transition-all shadow-sm">
                    <small class="text-red-600 font-semibold text-xs mt-1 empty:hidden" th:errors="*{confirmPassword}"></small>
                </label>

                <button type="submit" class="mt-4 w-full bg-gradient-to-br from-amber-600 to-amber-800 text-white font-bold rounded-xl px-6 py-3.5 shadow-lg shadow-amber-900/20 hover:shadow-xl hover:shadow-amber-900/40 hover:-translate-y-0.5 transition-all">
                    Daftar Sekarang
                </button>
            </form>

            <p class="mt-6 text-center text-slate-500 font-medium text-sm">
                Sudah punya akun? <a th:href="@{/login}" class="text-amber-700 font-bold hover:text-amber-800 transition-colors">Login di sini</a>
            </p>
        </section>
    </main>
</body>
</html>
