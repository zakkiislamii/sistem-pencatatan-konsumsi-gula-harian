services:
  mysql:
    image: mysql:8.4
    container_name: gula-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gula_db
      MYSQL_USER: gula_user
      MYSQL_PASSWORD: gula_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data: